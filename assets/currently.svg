<svg xmlns="http://www.w3.org/2000/svg" width="920" height="176" viewBox="0 0 920 176" role="img" aria-label="Currently. Building: Lumenera, fault detection that runs on an ESP32 with no server. Reading: how to build better 3D websites that move as you scroll. Looking for: research assistantships and AI engineering roles, remote.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050505"/><stop offset="1" stop-color="#17120a"/></linearGradient>
<style>@font-face{font-family:'GS';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'GM';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}
.lbl{font:600 11px 'GM',ui-monospace,monospace;letter-spacing:2px;fill:#d4af37}
.txt{font:600 18px 'GS',system-ui,sans-serif;fill:#f4f1ea}
.in{opacity:0;animation:in .7s ease-out forwards}.d1{animation-delay:.2s}.d2{animation-delay:.4s}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.rule{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-out .15s forwards}.r1{animation-delay:.35s}
@keyframes draw{to{stroke-dashoffset:0}}
.caret{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1}.rule{animation:none;stroke-dashoffset:0}.caret{animation:none}}
</style></defs>
<rect x=".5" y=".5" width="919" height="175" rx="16" fill="url(#bg)" stroke="#d4af37" stroke-opacity=".45"/>
<g class="in d0"><rect x="36" y="32" width="7" height="7" rx="1.5" fill="#d4af37"/><text class="lbl" x="58" y="40">BUILDING</text><text class="txt" x="196" y="42">Lumenera: fault detection that runs on an ESP32, with no server</text><rect class="caret" x="764.4" y="27" width="2" height="20" fill="#d4af37"/></g><g class="in d1"><rect x="36" y="84" width="7" height="7" rx="1.5" fill="#8a7230"/><text class="lbl" x="58" y="92">READING</text><text class="txt" x="196" y="94">How to build better 3D websites that move as you scroll</text></g><g class="in d2"><rect x="36" y="136" width="7" height="7" rx="1.5" fill="#22c55e"/><text class="lbl" x="58" y="144">LOOKING FOR</text><text class="txt" x="196" y="146">Research assistantships and AI engineering roles, remote</text></g><line class="rule r0" x1="36" y1="62" x2="884" y2="62" stroke="#d4af37" stroke-opacity="0.2" pathLength="1"/><line class="rule r1" x1="36" y1="114" x2="884" y2="114" stroke="#d4af37" stroke-opacity="0.2" pathLength="1"/>
</svg>