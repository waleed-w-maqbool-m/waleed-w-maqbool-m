<svg xmlns="http://www.w3.org/2000/svg" width="920" height="112" viewBox="0 0 920 112" role="img" aria-label="Final year at FAST-NUCES, graduating August 2027. Open to AI engineering and research roles, remote or on-site.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050505"/><stop offset="1" stop-color="#17120a"/></linearGradient>
<style>@font-face{font-family:'GS';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'GS';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'GM';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}
.lbl{font:600 11px 'GM',ui-monospace,monospace;letter-spacing:2px;fill:#d4af37}
.big{font:600 20px 'GS',system-ui,sans-serif;fill:#f4f1ea}
.mid{font:600 18px 'GS',system-ui,sans-serif;fill:#f4f1ea}
.sub{font:500 13px 'GS',system-ui,sans-serif;fill:#9a968c}
.btn{font:600 12px 'GM',ui-monospace,monospace;letter-spacing:1.5px;fill:#0a0a0a}
.in{opacity:0;animation:in .7s ease-out forwards}.d2{animation-delay:.2s}.d3{animation-delay:.4s}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.rule{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-out .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1}.rule{animation:none;stroke-dashoffset:0}}
</style></defs>
<rect x=".5" y=".5" width="919" height="111" rx="16" fill="url(#bg)" stroke="#d4af37" stroke-opacity=".45"/>
<g class="in"><text class="lbl" x="36" y="36">NOW</text><text class="big" x="36" y="64">Final year at FAST-NUCES</text><text class="sub" x="36" y="88">Graduating August 2027</text></g>
<line class="rule" x1="362" y1="24" x2="362" y2="88" stroke="#d4af37" stroke-opacity=".35" pathLength="1"/>
<g class="in d2"><rect x="388" y="29" width="7" height="7" rx="1.5" fill="#22c55e"/><text class="lbl" x="404" y="36">OPEN TO</text><text class="mid" x="388" y="64">AI engineering and research roles</text><text class="sub" x="388" y="88">Remote or on-site</text></g>
<g class="in d3"><rect x="770" y="38" width="120" height="36" rx="18" fill="#d4af37"/><text class="btn" x="830" y="60.5" text-anchor="middle">EMAIL ME</text></g>
</svg>