<svg xmlns="http://www.w3.org/2000/svg" width="920" height="112" viewBox="0 0 920 112" role="img" aria-label="Final year at FAST-NUCES, graduating August 2027. Open to AI engineering and research roles, remote or on-site.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="1" stop-color="#17120a"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f5d77a" stop-opacity="1"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="0.5" y="0.5" width="919" height="111" rx="16"/></clipPath>
    <style>
      .lbl { font: 700 11px 'Segoe UI', system-ui, -apple-system, sans-serif; letter-spacing: 2.5px; fill: #d4af37; }
      .big { font: 700 20px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #f5f5f5; }
      .mid { font: 700 17px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #f5f5f5; }
      .sub { font: 400 13px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #9ca3af; }
      .btn { font: 700 13px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #0a0a0a; letter-spacing: 0.5px; }
      .in { opacity: 0; animation: in 0.8s ease-out forwards; }
      .d2 { animation-delay: 0.25s; }
      .d3 { animation-delay: 0.5s; }
      @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      .sweep { animation: sweep 5s linear infinite; }
      @keyframes sweep { from { transform: translateX(-260px); } to { transform: translateX(1180px); } }
      .halo { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
      @keyframes pulse { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(3); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .in { animation: none; opacity: 1; } .sweep, .halo { animation: none; } .halo { opacity: 0; } }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="919" height="111" rx="16" fill="url(#bg)" stroke="#d4af37" stroke-opacity="0.45"/>
  <g clip-path="url(#clip)"><rect class="sweep" x="0" y="0" width="260" height="2.5" fill="url(#sh)"/></g>

  <g class="in">
    <text class="lbl" x="36" y="36">NOW</text>
    <text class="big" x="36" y="64">Final year at FAST-NUCES</text>
    <text class="sub" x="36" y="88">Graduating August 2027</text>
  </g>

  <line x1="362" y1="24" x2="362" y2="88" stroke="#d4af37" stroke-opacity="0.35"/>

  <g class="in d2">
    <circle cx="396" cy="32" r="4" fill="#22c55e"/>
    <circle class="halo" cx="396" cy="32" r="4" fill="#22c55e"/>
    <text class="lbl" x="410" y="36">OPEN TO</text>
    <text class="mid" x="388" y="64">AI engineering and research roles</text>
    <text class="sub" x="388" y="88">Remote or on-site</text>
  </g>

  <g class="in d3">
    <rect x="790" y="38" width="100" height="36" rx="18" fill="#d4af37"/>
    <text class="btn" x="840" y="61" text-anchor="middle">Email me</text>
  </g>
</svg>
