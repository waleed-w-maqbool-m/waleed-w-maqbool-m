<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Waleed Maqbool, AI and Computer Engineer">
<defs>
<linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#000"/><stop offset=".35" stop-color="#0d0a02"/><stop offset=".7" stop-color="#7a5c12"/><stop offset="1" stop-color="#d4af37"/></linearGradient>
<mask id="mb" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="200"><path fill="#fff" d="M0,-10 L0,160 Q150,132 300,160 T600,160 T900,160 T1200,160 T1500,160 T1800,160 L1800,-10 Z"><animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="16s" repeatCount="indefinite"/></path></mask>
<mask id="mf" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="200"><path fill="#fff" d="M0,-10 L0,148 Q100,124 200,148 T400,148 T600,148 T800,148 T1000,148 T1200,148 T1400,148 T1600,148 T1800,148 L1800,-10 Z"><animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="10s" repeatCount="indefinite"/></path></mask>
<style>@font-face{font-family:'GS';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'GM';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}
.name{font:700 56px 'GS',system-ui,sans-serif;fill:#f5d77a;letter-spacing:-1px}
.role{font:500 20px 'GM',ui-monospace,monospace;fill:#e9e5da;letter-spacing:3px}
.in{opacity:0;animation:in .9s ease-out forwards}.d2{animation-delay:.25s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1}}
</style></defs>
<rect width="1200" height="200" fill="url(#g)" opacity=".5" mask="url(#mb)"/>
<rect width="1200" height="200" fill="url(#g)" mask="url(#mf)"/>
<g class="in"><text class="name" x="600" y="92" text-anchor="middle">Waleed Maqbool</text></g>
<g class="in d2"><text class="role" x="600" y="128" text-anchor="middle">AI AND COMPUTER ENGINEER</text></g>
</svg>